name: Verify web and backend

on:
  push:
    branches:
      - fm/dashboard-data
  pull_request:
    paths:
      - "backend/**"
      - "dashboard/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-web-backend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
